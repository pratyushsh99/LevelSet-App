name: LevelSet
options:
  bundleIdPrefix: com.pratyushsharma.levelset
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  LevelSet:
    type: application
    platform: iOS
    sources:
      - path: LevelSet
      - path: Shared
    resources:
      - path: LevelSet/Fonts
    info:
      path: LevelSet/App/Info.plist
      properties:
        CFBundleDisplayName: LevelSet
        UILaunchScreen: {}
        NSCameraUsageDescription: "LevelSet uses your camera on-device to count reps during movement challenges. Video never leaves your phone."
        UIBackgroundModes: []
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - levelset
        NSSupportsLiveActivities: true
        UIAppFonts:
          - Poppins-Medium.ttf
          - Poppins-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pratyushsharma.levelset
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Sunrise AppIcon-Tidepool AppIcon-Nightwalk"
    dependencies:
      - target: LevelSetWidgets
        embed: true

  LevelSetWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LevelSetWidgets
      - path: Shared
    info:
      path: LevelSetWidgets/Info.plist
      properties:
        CFBundleDisplayName: LevelSet Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pratyushsharma.levelset.widgets
        SKIP_INSTALL: true

schemes:
  LevelSet:
    build:
      targets:
        LevelSet: all
    run:
      config: Debug
    archive:
      config: Release
